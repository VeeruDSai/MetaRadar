<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1060" width="100%" height="100%" style="background:#080e1a; font-family:'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="rf-arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="rf-arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2dd4bf"/>
    </marker>
    <marker id="rf-arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
    <marker id="rf-arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>

    <!-- Shadow -->
    <filter id="rfShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1440" height="1060" fill="#080e1a"/>

  <!-- Blueprint Dot Grid -->
  <g opacity="0.06" fill="#94a3b8">
    <pattern id="rfGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5"/>
    </pattern>
    <rect width="1440" height="1060" fill="url(#rfGrid)"/>
  </g>

  <!-- Header Bar -->
  <g transform="translate(60, 30)">
    <rect x="0" y="0" width="1320" height="60" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" filter="url(#rfShadow)"/>
    <text x="24" y="28" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="-0.3">MetaRadar Decision Governance &amp; Responsibility Framework</text>
    <text x="24" y="48" fill="#94a3b8" font-size="11.5" font-weight="500">Why Biopharma Signals Must Be Reviewed &amp; How Cross-Functional Decisions Are Audited</text>
    <rect x="1130" y="16" width="165" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="1212" y="34" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">Governance &amp; Auditability</text>
  </g>

  <!-- ========================================================= -->
  <!-- PART A: WHY SIGNALS MUST BE REVIEWED (THE 4 IMPERATIVES)  -->
  <!-- ========================================================= -->
  <g transform="translate(60, 110)">
    <rect width="1320" height="200" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" filter="url(#rfShadow)"/>
    <rect width="1320" height="32" rx="14" fill="#1e293b"/>
    <rect y="16" width="1320" height="16" fill="#1e293b"/>
    <text x="18" y="22" fill="#f43f5e" font-size="11.5" font-weight="800" letter-spacing="0.8">PART A · WHY BIOPHARMA SIGNALS MUST BE REVIEWED (CRITICAL IMPERATIVES)</text>

    <g transform="translate(18, 48)">
      <!-- Card 1: Safety -->
      <g transform="translate(0, 0)">
        <rect width="306" height="136" rx="8" fill="#1c1118" stroke="#be123c" stroke-width="1"/>
        <text x="14" y="26" fill="#fb7185" font-size="12" font-weight="700">1. Patient Safety &amp; Pharmacovigilance</text>
        <text x="14" y="48" fill="#e2e8f0" font-size="10">Unreviewed adverse events (thrombosis,</text>
        <text x="14" y="66" fill="#e2e8f0" font-size="10">inhibitor formation, TMA) create severe</text>
        <text x="14" y="84" fill="#e2e8f0" font-size="10">clinical risk and regulatory exposure.</text>
        <text x="14" y="116" fill="#fb7185" font-size="9.5" font-weight="700">Mandatory PV Signal Triaging</text>
      </g>

      <!-- Card 2: Regulatory -->
      <g transform="translate(324, 0)">
        <rect width="306" height="136" rx="8" fill="#1f1809" stroke="#b45309" stroke-width="1"/>
        <text x="14" y="26" fill="#fbbf24" font-size="12" font-weight="700">2. Regulatory Filing Compliance</text>
        <text x="14" y="48" fill="#e2e8f0" font-size="10">PDUFA dates, CHMP opinions, and BLA/NDA</text>
        <text x="14" y="66" fill="#e2e8f0" font-size="10">milestones enforce statutory deadlines</text>
        <text x="14" y="84" fill="#e2e8f0" font-size="10">that demand timely formal response.</text>
        <text x="14" y="116" fill="#fbbf24" font-size="9.5" font-weight="700">Auditable Regulatory Timelines</text>
      </g>

      <!-- Card 3: Competitive Agility -->
      <g transform="translate(648, 0)">
        <rect width="306" height="136" rx="8" fill="#0c2038" stroke="#0369a1" stroke-width="1"/>
        <text x="14" y="26" fill="#38bdf8" font-size="12" font-weight="700">3. Commercial &amp; Competitive Agility</text>
        <text x="14" y="48" fill="#e2e8f0" font-size="10">Competitor trial shifts (Altuviiio, Hemlibra,</text>
        <text x="14" y="66" fill="#e2e8f0" font-size="10">Roctavian, Mim8) impact market position,</text>
        <text x="14" y="84" fill="#e2e8f0" font-size="10">pricing strategy, and access negotiations.</text>
        <text x="14" y="116" fill="#38bdf8" font-size="9.5" font-weight="700">Proactive Market Defense</text>
      </g>

      <!-- Card 4: Epistemic Accountability -->
      <g transform="translate(972, 0)">
        <rect width="312" height="136" rx="8" fill="#141c2b" stroke="#475569" stroke-width="1"/>
        <text x="14" y="26" fill="#cbd5e1" font-size="12" font-weight="700">4. Epistemic AI Accountability</text>
        <text x="14" y="48" fill="#e2e8f0" font-size="10">AI suggests decisions; humans sign off.</text>
        <text x="14" y="66" fill="#e2e8f0" font-size="10">Distinguishing [FACT] from [SPECULATION]</text>
        <text x="14" y="84" fill="#e2e8f0" font-size="10">prevents ungrounded algorithmic bias.</text>
        <text x="14" y="116" fill="#34d399" font-size="9.5" font-weight="700">Human-in-the-Loop Gate (HITL)</text>
      </g>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- PART B: HOW SIGNALS ARE REVIEWED (THE 4-STAGE GOVERNANCE) -->
  <!-- ========================================================= -->
  <g transform="translate(60, 330)">
    <rect width="1320" height="690" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" filter="url(#rfShadow)"/>
    <rect width="1320" height="32" rx="14" fill="#1e293b"/>
    <rect y="16" width="1320" height="16" fill="#1e293b"/>
    <text x="18" y="22" fill="#38bdf8" font-size="11.5" font-weight="800" letter-spacing="0.8">PART B · HOW SIGNALS ARE REVIEWED (THE 4-STAGE GOVERNANCE WORKFLOW)</text>

    <!-- STAGE 1: INGESTION & AUTO ROUTING -->
    <g transform="translate(20, 50)">
      <rect width="270" height="260" rx="10" fill="#082f49" stroke="#0284c7" stroke-width="1.2"/>
      <rect width="270" height="28" rx="10" fill="#0284c7"/>
      <rect y="16" width="270" height="12" fill="#0284c7"/>
      <text x="135" y="19" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">STAGE 1: AUTO ROUTING</text>
      
      <text x="16" y="52" fill="#38bdf8" font-size="12" font-weight="700">Deterministic Scoring</text>
      <text x="16" y="72" fill="#94a3b8" font-size="10">Score = Novelty + Clinical +</text>
      <text x="16" y="90" fill="#94a3b8" font-size="10">Regulatory + Recency (0–100)</text>

      <line x1="16" y1="104" x2="254" y2="104" stroke="#0284c7" stroke-width="0.8"/>

      <text x="16" y="126" fill="#ffffff" font-size="11" font-weight="700">Scoped Queue Delivery</text>
      <text x="16" y="146" fill="#cbd5e1" font-size="10">• Medical Affairs (ABR / Trials)</text>
      <text x="16" y="166" fill="#cbd5e1" font-size="10">• Regulatory (Filing Deadlines)</text>
      <text x="16" y="186" fill="#cbd5e1" font-size="10">• Safety / PV (Adverse Events)</text>
      <text x="16" y="206" fill="#cbd5e1" font-size="10">• Market Access (ICER / Price)</text>
      <text x="16" y="238" fill="#38bdf8" font-size="9.5" font-weight="700">Automated Persona Filtering</text>
    </g>

    <!-- Arrow Stage 1 -> Stage 2 -->
    <path d="M 290 180 L 318 180" stroke="#38bdf8" stroke-width="2" marker-end="url(#rf-arrow-blue)"/>

    <!-- STAGE 2: 4-QUESTION DOMAIN EVALUATION -->
    <g transform="translate(324, 50)">
      <rect width="400" height="260" rx="10" fill="#042f2e" stroke="#0d9488" stroke-width="1.2"/>
      <rect width="400" height="28" rx="10" fill="#0d9488"/>
      <rect y="16" width="400" height="12" fill="#0d9488"/>
      <text x="200" y="19" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">STAGE 2: 4-QUESTION EVALUATION</text>

      <text x="16" y="52" fill="#2dd4bf" font-size="12" font-weight="700">Domain Expert Triaging</text>

      <g transform="translate(16, 62)">
        <!-- Q1 -->
        <rect width="368" height="42" rx="6" fill="#064e3b"/>
        <text x="10" y="18" fill="#6ee7b7" font-size="10.5" font-weight="700">Q1. What Changed?</text>
        <text x="10" y="33" fill="#e2e8f0" font-size="9">Verifiable facts extracted directly from primary dossier</text>

        <!-- Q2 -->
        <g transform="translate(0, 48)">
          <rect width="368" height="42" rx="6" fill="#064e3b"/>
          <text x="10" y="18" fill="#6ee7b7" font-size="10.5" font-weight="700">Q2. Why It Matters?</text>
          <text x="10" y="33" fill="#e2e8f0" font-size="9">Clinical relevance, ABR endpoints, and competitive threat</text>
        </g>

        <!-- Q3 -->
        <g transform="translate(0, 96)">
          <rect width="368" height="42" rx="6" fill="#064e3b"/>
          <text x="10" y="18" fill="#6ee7b7" font-size="10.5" font-weight="700">Q3. Who Should Act?</text>
          <text x="10" y="33" fill="#e2e8f0" font-size="9">Primary functional owner assigned via routing matrix</text>
        </g>

        <!-- Q4 -->
        <g transform="translate(0, 144)">
          <rect width="368" height="42" rx="6" fill="#064e3b"/>
          <text x="10" y="18" fill="#6ee7b7" font-size="10.5" font-weight="700">Q4. Suggested Action?</text>
          <text x="10" y="33" fill="#e2e8f0" font-size="9">AI-proposed operational step (prefaced: requires review)</text>
        </g>
      </g>
    </g>

    <!-- Arrow Stage 2 -> Stage 3 -->
    <path d="M 724 180 L 752 180" stroke="#2dd4bf" stroke-width="2" marker-end="url(#rf-arrow-teal)"/>

    <!-- STAGE 3: DECISION BRANCHING (3 PATHS) -->
    <g transform="translate(758, 50)">
      <rect width="542" height="260" rx="10" fill="#1f1809" stroke="#d97706" stroke-width="1.2"/>
      <rect width="542" height="28" rx="10" fill="#d97706"/>
      <rect y="16" width="542" height="12" fill="#d97706"/>
      <text x="271" y="19" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">STAGE 3: TRIAGE &amp; DECISION ACTIONS</text>

      <g transform="translate(16, 44)">
        <!-- Branch A -->
        <g transform="translate(0, 0)">
          <rect width="510" height="56" rx="6" fill="#3b2405" stroke="#f59e0b" stroke-width="0.8"/>
          <circle cx="24" cy="28" r="12" fill="#10b981"/>
          <text x="24" y="32" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">A</text>
          <text x="46" y="24" fill="#fcd34d" font-size="11" font-weight="700">Routine Operational Action Approved</text>
          <text x="46" y="42" fill="#94a3b8" font-size="9.5">Local lead signs off (e.g. update standard medical slide deck or dossier)</text>
        </g>

        <!-- Branch B -->
        <g transform="translate(0, 68)">
          <rect width="510" height="56" rx="6" fill="#3b2405" stroke="#f59e0b" stroke-width="0.8"/>
          <circle cx="24" cy="28" r="12" fill="#f59e0b"/>
          <text x="24" y="32" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">B</text>
          <text x="46" y="24" fill="#fcd34d" font-size="11" font-weight="700">Cross-Functional Escalation Triggered</text>
          <text x="46" y="42" fill="#94a3b8" font-size="9.5">Multi-team impact → routed directly to Executive Leadership Queue</text>
        </g>

        <!-- Branch C -->
        <g transform="translate(0, 136)">
          <rect width="510" height="56" rx="6" fill="#3b2405" stroke="#f59e0b" stroke-width="0.8"/>
          <circle cx="24" cy="28" r="12" fill="#8b5cf6"/>
          <text x="24" y="32" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">C</text>
          <text x="46" y="24" fill="#fcd34d" font-size="11" font-weight="700">Stakeholder Disagreement / Feedback Submitted</text>
          <text x="46" y="42" fill="#94a3b8" font-size="9.5">User rates relevance &amp; logs note → recalibrates scoring weights</text>
        </g>
      </g>
    </g>

    <!-- Connecting Path from Stage 3 Branch B down to Stage 4 -->
    <path d="M 1020 310 L 1020 338 L 660 338 L 660 365" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#rf-arrow-amber)"/>
    <!-- Clean badge for path -->
    <rect x="780" y="326" width="120" height="22" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="840" y="341" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Escalated Signal</text>

    <!-- STAGE 4: EXECUTIVE STEER & IMMUTABLE WORM AUDIT -->
    <g transform="translate(20, 375)">
      <rect width="1280" height="295" rx="12" fill="#14112b" stroke="#7c3aed" stroke-width="1.5"/>
      <rect width="1280" height="30" rx="12" fill="#6d28d9"/>
      <rect y="16" width="1280" height="14" fill="#6d28d9"/>
      <text x="640" y="21" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">STAGE 4: EXECUTIVE LEADERSHIP STEER &amp; IMMUTABLE WORM AUDIT CLOSURE</text>

      <g transform="translate(20, 48)">
        <!-- Box 1: Leadership Queue -->
        <g transform="translate(0, 0)">
          <rect width="380" height="220" rx="8" fill="#1e1838" stroke="#8b5cf6" stroke-width="1"/>
          <text x="16" y="26" fill="#c4b5fd" font-size="12.5" font-weight="700">1. Executive Leadership Queue</text>
          <text x="16" y="46" fill="#e2e8f0" font-size="10.5">Chief Medical Officer / VP Strategy</text>
          <line x1="16" y1="58" x2="364" y2="58" stroke="#8b5cf6" stroke-width="0.8"/>
          
          <text x="16" y="82" fill="#94a3b8" font-size="10">• Reviews cross-functional impact</text>
          <text x="16" y="104" fill="#94a3b8" font-size="10">• Evaluates clinical trial vs regulatory tradeoffs</text>
          <text x="16" y="126" fill="#94a3b8" font-size="10">• Approves enterprise-wide directive</text>
          <text x="16" y="148" fill="#94a3b8" font-size="10">• Rejects / requests additional evidence</text>
          <text x="16" y="190" fill="#10b981" font-size="10" font-weight="700">Formal Sign-Off Enforced via RBAC</text>
        </g>

        <!-- Arrow 1 -> 2 -->
        <path d="M 380 110 L 420 110" stroke="#8b5cf6" stroke-width="2" marker-end="url(#rf-arrow-purple)"/>

        <!-- Box 2: Directive Execution -->
        <g transform="translate(430, 0)">
          <rect width="380" height="220" rx="8" fill="#1e1838" stroke="#8b5cf6" stroke-width="1"/>
          <text x="16" y="26" fill="#c4b5fd" font-size="12.5" font-weight="700">2. Directive Execution &amp; Notification</text>
          <text x="16" y="46" fill="#e2e8f0" font-size="10.5">Operational Guidance Propagated</text>
          <line x1="16" y1="58" x2="364" y2="58" stroke="#8b5cf6" stroke-width="0.8"/>

          <text x="16" y="82" fill="#94a3b8" font-size="10">• Medical Affairs adjusts field guidance</text>
          <text x="16" y="104" fill="#94a3b8" font-size="10">• Regulatory prepares dossier defense</text>
          <text x="16" y="126" fill="#94a3b8" font-size="10">• Safety initiates targeted surveillance</text>
          <text x="16" y="148" fill="#94a3b8" font-size="10">• Market Access revises reimbursement models</text>
          <text x="16" y="190" fill="#f59e0b" font-size="10" font-weight="700">Cross-Functional Alignment Complete</text>
        </g>

        <!-- Arrow 2 -> 3 -->
        <path d="M 810 110 L 850 110" stroke="#8b5cf6" stroke-width="2" marker-end="url(#rf-arrow-purple)"/>

        <!-- Box 3: WORM Audit -->
        <g transform="translate(860, 0)">
          <rect width="380" height="220" rx="8" fill="#1e1838" stroke="#10b981" stroke-width="1.2"/>
          <text x="16" y="26" fill="#34d399" font-size="12.5" font-weight="800">3. Immutable WORM Audit Trail</text>
          <text x="16" y="46" fill="#e2e8f0" font-size="10.5">PostgreSQL Physical Lock Trigger</text>
          <line x1="16" y1="58" x2="364" y2="58" stroke="#10b981" stroke-width="0.8"/>

          <text x="16" y="82" fill="#94a3b8" font-size="10">• User ID, Role, and Timestamp recorded</text>
          <text x="16" y="104" fill="#94a3b8" font-size="10">• Before/After state cryptographic hash</text>
          <text x="16" y="126" fill="#94a3b8" font-size="10">• Zero UPDATE / DELETE allowed by trigger</text>
          <text x="16" y="148" fill="#94a3b8" font-size="10">• Tamper-evident governance history</text>
          <text x="16" y="190" fill="#10b981" font-size="10" font-weight="700">Immutable Audit Trail</text>
        </g>
      </g>
    </g>
  </g>

</svg>
