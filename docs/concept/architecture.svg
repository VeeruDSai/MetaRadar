<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380" style="background-color: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="hdr-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0EA5E9"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="15" y="10" width="1070" height="42" rx="7" fill="url(#hdr-grad)" filter="url(#sh)"/>
  <text x="30" y="32" fill="#FFFFFF" font-size="18" font-weight="800" letter-spacing="0.5">METARADAR SYSTEM ARCHITECTURE OVERVIEW</text>
  <text x="30" y="45" fill="#38BDF8" font-size="10" font-weight="600">High-Level Data Flow &amp; Technology Stack · Aura Pharmers (Novo Nordisk GBS Hackathon 2026)</text>

  <!-- Step 1: External Sources -->
  <g transform="translate(15, 58)">
    <rect x="0" y="0" width="1070" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#sh)"/>
    <text x="12" y="14" fill="#0F172A" font-size="9" font-weight="800" letter-spacing="0.5">EXTERNAL SIGNAL SOURCES</text>
    
    <rect x="12" y="18" width="138" height="18" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <text x="81" y="31" fill="#1E293B" font-size="9" font-weight="700" text-anchor="middle">PubMed / Literature</text>
    
    <rect x="155" y="18" width="138" height="18" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <text x="224" y="31" fill="#1E293B" font-size="9" font-weight="700" text-anchor="middle">ClinicalTrials.gov</text>
    
    <rect x="298" y="18" width="148" height="18" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <text x="372" y="31" fill="#1E293B" font-size="9" font-weight="700" text-anchor="middle">Pharma News / Press</text>
    
    <rect x="451" y="18" width="148" height="18" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
    <text x="525" y="31" fill="#475569" font-size="9" font-weight="700" text-anchor="middle">Congresses (ASH/ISTH)</text>

    <rect x="604" y="18" width="148" height="18" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
    <text x="678" y="31" fill="#475569" font-size="9" font-weight="700" text-anchor="middle">Regulatory / Safety</text>

    <rect x="757" y="18" width="140" height="18" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
    <text x="827" y="31" fill="#475569" font-size="9" font-weight="700" text-anchor="middle">Patient / Access</text>

    <rect x="902" y="18" width="154" height="18" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
    <text x="979" y="31" fill="#1D4ED8" font-size="9" font-weight="700" text-anchor="middle">Synthetic Demo Data</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="550" y1="100" x2="550" y2="108" stroke="#0EA5E9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: 9 Human-Readable Stages Container -->
  <g transform="translate(15, 108)">
    <rect x="0" y="0" width="1070" height="190" rx="7" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="2" filter="url(#sh)"/>
    <rect x="0" y="0" width="1070" height="20" rx="7" fill="#0EA5E9"/>
    <text x="16" y="14" fill="#FFFFFF" font-size="10" font-weight="800" letter-spacing="0.5">LANGGRAPH INTELLIGENCE WORKFLOW — 9 STAGES</text>

    <!-- 9 Stages arranged in 3x3 Grid -->
    <!-- Row 1 -->
    <rect x="14" y="26" width="335" height="46" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="26" y="43" fill="#0EA5E9" font-size="11" font-weight="800">1–2. COLLECT &amp; VALIDATE</text>
    <text x="26" y="60" fill="#475569" font-size="10">Modular source connectors &amp; PII/PHI filter</text>

    <rect x="368" y="26" width="335" height="46" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="380" y="43" fill="#0EA5E9" font-size="11" font-weight="800">3. UNDERSTAND THE SIGNAL</text>
    <text x="380" y="60" fill="#475569" font-size="10">Entity extraction &amp; Haemophilia domain mapping</text>

    <rect x="721" y="26" width="335" height="46" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="733" y="43" fill="#0EA5E9" font-size="11" font-weight="800">4. CONNECT RELATED EVIDENCE</text>
    <text x="733" y="60" fill="#475569" font-size="10">Multi-source confluence &amp; asset lifecycle tracking</text>

    <!-- Row 2 -->
    <rect x="14" y="78" width="335" height="46" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="26" y="95" fill="#0EA5E9" font-size="11" font-weight="800">5. CHALLENGE WEAK CONCLUSIONS</text>
    <text x="26" y="112" fill="#475569" font-size="10">AI checks conflicting trial/cohort evidence</text>

    <rect x="368" y="78" width="335" height="46" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="380" y="95" fill="#0EA5E9" font-size="11" font-weight="800">6–7. PRIORITIZE &amp; ROUTE</text>
    <text x="380" y="112" fill="#475569" font-size="10">Expected milestone watch &amp; role relevance routing</text>

    <rect x="721" y="78" width="335" height="46" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="733" y="95" fill="#0EA5E9" font-size="11" font-weight="800">8–9. EXPLAIN &amp; LEARN</text>
    <text x="733" y="112" fill="#475569" font-size="10">Fact/Interpretation tagging &amp; calibration loop</text>

    <!-- Row 3: AI Layer -->
    <rect x="14" y="130" width="1042" height="48" rx="5" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="28" y="149" fill="#065F46" font-size="11" font-weight="800">AI REASONING LAYER:</text>
    <text x="160" y="149" fill="#047857" font-size="10">Local Gemma 3 4B GPU · Optional Grok API · BART / Extractive Summarization Fallback</text>
    <text x="28" y="167" fill="#047857" font-size="10" font-weight="600">Source-linked by design, with 100% source-linking as a prototype evaluation target.</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="550" y1="298" x2="550" y2="306" stroke="#0EA5E9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: Platform & User Interfaces -->
  <g transform="translate(15, 306)">
    <rect x="0" y="0" width="1070" height="66" rx="7" fill="#0F172A" filter="url(#sh)"/>
    <text x="16" y="16" fill="#FFFFFF" font-size="10" font-weight="800" letter-spacing="0.5">DECISION-FIRST USER INTERFACES</text>

    <rect x="14" y="22" width="245" height="36" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="136.5" y="38" fill="#38BDF8" font-size="11" font-weight="800" text-anchor="middle">Signal Radar</text>
    <text x="136.5" y="50" fill="#94A3B8" font-size="9" text-anchor="middle">Priority signal feed</text>

    <rect x="274" y="22" width="245" height="36" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="396.5" y="38" fill="#38BDF8" font-size="11" font-weight="800" text-anchor="middle">Four-Question Cards</text>
    <text x="396.5" y="50" fill="#94A3B8" font-size="9" text-anchor="middle">Q1: What? Q2: Why? Q3: Route Q4: Act</text>

    <rect x="534" y="22" width="260" height="36" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="664" y="38" fill="#38BDF8" font-size="11" font-weight="800" text-anchor="middle">Intelligence Digest</text>
    <text x="664" y="50" fill="#94A3B8" font-size="9" text-anchor="middle">Role-filtered executive briefs</text>

    <rect x="809" y="22" width="247" height="36" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="932.5" y="38" fill="#38BDF8" font-size="11" font-weight="800" text-anchor="middle">Ask Athena</text>
    <text x="932.5" y="50" fill="#94A3B8" font-size="9" text-anchor="middle">Grounded conversational Q&amp;A</text>
  </g>
</svg>