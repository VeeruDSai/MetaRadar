domain_config_version: "v5.1.0"
disease_area: "Haemophilia within Rare Disease"
pilot_area: "Haemophilia A & Haemophilia B"

diseases:
  - id: "haemophilia_a"
    name: "Haemophilia A"
    icd10: "D66"
    deficiency: "Factor VIII"
    description: "X-linked recessive bleeding disorder caused by deficiency of coagulation Factor VIII."
  - id: "haemophilia_b"
    name: "Haemophilia B"
    icd10: "D67"
    deficiency: "Factor IX"
    description: "X-linked recessive bleeding disorder caused by deficiency of coagulation Factor IX."

factor_classifications:
  - "FVIII"
  - "FIX"

inhibitor_categories:
  - "with_inhibitors"
  - "without_inhibitors"
  - "all_inhibitor_statuses"

patient_segments:
  - "adult"
  - "pediatric"
  - "previously_treated"
  - "previously_untreated"

assets:
  - id: "concizumab"
    brand_name: "Alhemo"
    generic_name: "concizumab"
    company: "Novo Nordisk"
    mechanism: "anti-TFPI monoclonal antibody"
    modality: "subcutaneous monoclonal antibody"
    indication: "Haemophilia A and B with inhibitors"
    approval_status: "approved"
    approval_date: "2024-12"
    jurisdiction: "FDA"
    is_novo_nordisk: true
  - id: "mim8"
    brand_name: "mim8"
    generic_name: "mim8"
    company: "Novo Nordisk"
    mechanism: "FVIIIa-mimetic bispecific antibody"
    modality: "subcutaneous bispecific antibody"
    indication: "Haemophilia A with and without inhibitors"
    approval_status: "in_clinical_trials"
    jurisdiction: "Global Phase 3"
    is_novo_nordisk: true
  - id: "emicizumab"
    brand_name: "Hemlibra"
    generic_name: "emicizumab"
    company: "Roche"
    mechanism: "FVIIIa-mimetic bispecific antibody"
    modality: "subcutaneous bispecific antibody"
    indication: "Haemophilia A with and without inhibitors"
    approval_status: "approved"
    jurisdiction: "FDA / EMA"
    is_novo_nordisk: false
  - id: "etranacogene_dezaparvovec"
    brand_name: "Hemgenix"
    generic_name: "etranacogene dezaparvovec"
    company: "CSL Behring"
    mechanism: "AAV5 gene therapy expressing Factor IX-Padua"
    modality: "single-administration AAV gene therapy"
    indication: "Haemophilia B"
    approval_status: "approved"
    jurisdiction: "FDA / EMA"
    is_novo_nordisk: false
  - id: "valoctocogene_roxaparvovec"
    brand_name: "Roctavian"
    generic_name: "valoctocogene roxaparvovec"
    company: "BioMarin"
    mechanism: "AAV5 gene therapy expressing B-domain deleted Factor VIII"
    modality: "single-administration AAV gene therapy"
    indication: "Severe Haemophilia A"
    approval_status: "approved"
    approval_date: "2023-06"
    jurisdiction: "FDA / EMA"
    is_novo_nordisk: false
  - id: "fitusiran"
    brand_name: "Qfitlia"
    generic_name: "fitusiran"
    company: "Sanofi"
    mechanism: "siRNA targeting antithrombin"
    modality: "subcutaneous RNA interference"
    indication: "Haemophilia A and B with and without inhibitors"
    approval_status: "approved"
    approval_date: "2025-03"
    jurisdiction: "FDA"
    is_novo_nordisk: false
  - id: "marstacimab"
    brand_name: "Hympavzi"
    generic_name: "marstacimab"
    company: "Pfizer"
    mechanism: "anti-TFPI monoclonal antibody"
    modality: "subcutaneous monoclonal antibody"
    indication: "Haemophilia A and B without inhibitors (expanded 2026 to age 6+)"
    approval_status: "approved"
    approval_date: "2024-10"
    jurisdiction: "FDA / EMA"
    is_novo_nordisk: false

signal_types:
  - id: "CLINICAL_TRIAL"
    name: "Clinical Trial Update"
  - id: "PUBLICATIONS"
    name: "Scientific Publication"
  - id: "CONGRESS"
    name: "Congress Presentation / Abstract"
  - id: "REGULATORY"
    name: "Regulatory Decision / Filing"
  - id: "COMMERCIAL_PATENT"
    name: "Commercial & Patent Activity"
  - id: "SAFETY"
    name: "Safety Signal / Adverse Event Communication"
  - id: "ACCESS"
    name: "Market Access & Reimbursement Decision"

lifecycle_stages:
  - "announced"
  - "in_trial"
  - "interim_result"
  - "final_result"
  - "congress_publication"
  - "regulatory_development"
  - "approved"
  - "post_market"
  - "discontinued"

confluence:
  emerging_threshold: 2
  minimum_independent_signals: 3
  time_window_hours: 48

functions:
  - id: "MEDICAL_AFFAIRS"
    name: "Medical Affairs"
  - id: "REGULATORY"
    name: "Regulatory Affairs"
  - id: "SAFETY"
    name: "Safety / Pharmacovigilance"
  - id: "MARKET_ACCESS"
    name: "Market Access"
  - id: "COMMUNICATIONS"
    name: "Medical Communications"
  - id: "LEADERSHIP"
    name: "Executive Leadership"

baseline_routing_matrix:
  CLINICAL_TRIAL:
    primary: "MEDICAL_AFFAIRS"
    secondary: ["COMMUNICATIONS", "REGULATORY"]
  SAFETY:
    primary: "SAFETY"
    secondary: ["MEDICAL_AFFAIRS", "REGULATORY"]
  ACCESS:
    primary: "MARKET_ACCESS"
    secondary: ["MEDICAL_AFFAIRS"]
  REGULATORY:
    primary: "REGULATORY"
    secondary: ["MEDICAL_AFFAIRS", "LEADERSHIP"]
  CONGRESS:
    primary: "MEDICAL_AFFAIRS"
    secondary: ["COMMUNICATIONS", "REGULATORY"]
  PUBLICATIONS:
    primary: "MEDICAL_AFFAIRS"
    secondary: ["COMMUNICATIONS"]
  COMMERCIAL_PATENT:
    primary: "LEADERSHIP"
    secondary: ["MARKET_ACCESS"]

source_tiers:
  tier_1_authoritative:
    - "clinical_trials"
    - "pubmed"
    - "fda"
    - "ema"
    - "who_ictrp"
  tier_2_high_value:
    - "ash"
    - "isth"
    - "eha"
    - "company_ir"
    - "company_press"
  tier_3_discovery:
    - "newsapi"
    - "fierce_pharma"
    - "et_pharma"
    - "biopharmadive"
    - "reuters"
    - "bloomberg"
  tier_4_lead_only:
    - "blogs"
    - "social"
    - "unverified_aggregators"

connectors:
  pubmed:
    freshness_class: batch
    tier: 1
    backfill_days: 180
    rolling_window_days: 30
    max_results_per_profile: 200
    profiles:
      - id: haemophilia_clinical
        queries:
          - "haemophilia AND (emicizumab OR fitusiran OR marstacimab OR concizumab OR mim8 OR efanesoctocog)"
          - "haemophilia gene therapy AND (Hemgenix OR Roctavian OR fidanacogene OR etranacogene OR valoctocogene)"
      - id: haemophilia_safety
        queries:
          - "haemophilia inhibitor safety"
          - "haemophilia adverse event thrombosis"
      - id: competitive_news
        queries:
          - "mim8 OR fitusiran OR concizumab clinical trial"

  clinical_trials:
    freshness_class: near_real_time
    tier: 1
    backfill_days: 365
    rolling_window_days: 30
    max_results_per_profile: 500
    profiles:
      - id: haemophilia_trials
        conditions: ["hemophilia A", "hemophilia B", "haemophilia", "Factor VIII deficiency", "Factor IX deficiency"]
        interventions: ["emicizumab", "fitusiran", "marstacimab", "concizumab", "mim8", "fidanacogene", "etranacogene", "valoctocogene", "efanesoctocog alfa", "Alhemo", "Hemlibra", "Hemgenix", "Roctavian", "Qfitlia", "Hympavzi"]
      - id: novo_pipeline
        sponsor_keywords: ["Novo Nordisk"]
        conditions: ["hemophilia A", "hemophilia B", "haemophilia"]

  newsapi:
    freshness_class: delayed
    tier: 3
    quota_per_day: 100
    backfill_days: 30
    rolling_window_days: 7
    profiles:
      - id: haemophilia_market
        query: "haemophilia OR hemophilia (Roche OR CSL OR Novo OR Sanofi OR BioMarin OR Pfizer)"
        language: en
      - id: gene_therapy_news
        query: "gene therapy haemophilia OR hemophilia (Hemgenix OR Roctavian OR fidanacogene)"
        language: en

  fierce_pharma:
    freshness_class: delayed
    tier: 3
    rss_url: "https://www.fiercepharma.com/rss/xml"
    backfill_days: 30
    rolling_window_days: 7
    profiles:
      - id: haemophilia_pharma_news
        rss_url: "https://www.fiercepharma.com/rss/xml"
        keywords: ["haemophilia", "hemophilia", "emicizumab", "fitusiran", "concizumab", "mim8", "gene therapy", "Novo Nordisk", "FDA approval", "EMA", "Alhemo", "Hemlibra", "Hemgenix", "Hympavzi", "Qfitlia", "factor VIII", "factor IX"]

  et_pharma:
    freshness_class: delayed
    tier: 3
    rss_url: "https://pharma.economictimes.indiatimes.com/rss/topstories"
    backfill_days: 30
    rolling_window_days: 7
    profiles:
      - id: haemophilia_pharma_news
        rss_url: "https://pharma.economictimes.indiatimes.com/rss/topstories"
        keywords: ["haemophilia", "hemophilia", "bleeding disorder", "gene therapy", "Novo Nordisk", "Roche", "CSL Behring", "Sanofi", "emicizumab", "fitusiran"]
      - id: drug_approvals
        rss_url: "https://pharma.economictimes.indiatimes.com/rss/drug_approvals"
        keywords: ["haemophilia", "hemophilia", "factor VIII", "factor IX", "rare disease", "drug approval", "FDA", "EMA"]

  biopharmadive:
    freshness_class: manual
    tier: 3
    status: configured_no_feed
    backfill_days: 0
    rolling_window_days: 0
    notes: >
      BioPharma Dive covers FDA approvals, clinical readouts, drug pricing, and M&A.
      No public RSS or API feed available. Integration pending compliant mechanism.
      Source URL: https://www.biopharmadive.com/
    profiles: []

  fda:
    freshness_class: adapter_ready
    tier: 1
    base_url: "https://api.fda.gov/drug/drugsfda.json"
    backfill_days: 365
    rolling_window_days: 30
    profiles:
      - id: haemophilia_approvals
        search_terms: ["emicizumab", "concizumab", "mim8", "fitusiran", "marstacimab"]
      - id: fda_medwatch_safety
        rss_url: "https://www.fda.gov/safety/medwatch-fda-safety-information-and-adverse-event-reporting-program/medwatch-rss-feed"
        keywords: ["hemophilia", "haemophilia", "coagulation", "factor VIII", "factor IX", "emicizumab", "concizumab", "fitusiran", "marstacimab", "etranacogene"]
      - id: fda_drug_safety_comms
        rss_url: "https://www.fda.gov/about-fda/contact-fda/subscribe-podcasts-and-news-feeds"
        keywords: ["hemophilia", "haemophilia", "bleeding disorder", "factor VIII", "factor IX"]

  ema:
    freshness_class: adapter_ready
    tier: 1
    rss_url: "https://www.ema.europa.eu/en/medicines/rss"
    backfill_days: 365
    rolling_window_days: 30
    profiles:
      - id: haemophilia_ema
        rss_url: "https://www.ema.europa.eu/en/medicines/rss"
        keywords: ["haemophilia", "hemophilia", "emicizumab", "fitusiran", "concizumab", "marstacimab"]
      - id: ema_epars
        rss_url: "https://www.ema.europa.eu/en/news/rss"
        keywords: ["haemophilia", "hemophilia", "Alhemo", "Hemlibra", "Hemgenix", "Roctavian", "Hympavzi", "Qfitlia"]
      - id: ema_orphan_designations
        rss_url: "https://www.ema.europa.eu/en/medicines/rss"
        keywords: ["haemophilia", "hemophilia", "rare bleeding"]

cross_source:
  group_assignment:
    title_similarity_threshold: 0.85
    date_window_hours: 48
    entity_overlap_min: 2

lag_thresholds:
  announced: 120
  in_trial: 180
  interim_result: 120
  final_result: 180
  congress_publication: 90
  regulatory_development: 270
  approved: 365
  post_market: 365
  discontinued: 730

