<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background:#070d18; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1e38" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#070d18" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    
    <!-- Filter for subtle drop shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient background glow rings -->
  <circle cx="200" cy="150" r="280" fill="#06b6d4" opacity="0.04" filter="blur(60px)"/>
  <circle cx="1000" cy="650" r="320" fill="#3b82f6" opacity="0.04" filter="blur(70px)"/>
  <circle cx="600" cy="400" r="300" fill="#8b5cf6" opacity="0.03" filter="blur(80px)"/>

  <!-- Outer Canvas Border -->
  <rect x="20" y="20" width="1160" height="780" rx="24" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="10" stroke="#06b6d4" stroke-width="2" fill="none"/>
    <circle cx="22" cy="22" r="4" fill="#14b8a6"/>
    <line x1="22" y1="6" x2="22" y2="38" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
    <line x1="6" y1="22" x2="38" y2="22" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>

    <text x="60" y="24" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="-0.5">MetaRadar System Architecture</text>
    <text x="60" y="42" fill="#94a3b8" font-size="13" font-weight="500">Autonomous Evidence-Grounded Rare Disease Decision Intelligence Platform</text>
    
    <!-- Version Tag -->
    <rect x="940" y="8" width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="956" cy="22" r="4" fill="#10b981"/>
    <text x="968" y="26" fill="#e2e8f0" font-size="11" font-weight="700" letter-spacing="0.5">v5.1.0 PRODUCTION</text>
  </g>

  <!-- LAYER 1: INGESTION & DATA SOURCES -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="1080" height="120" rx="16" fill="#0b1324" stroke="#1e293b" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="6" height="120" rx="3" fill="#06b6d4"/>
    
    <text x="24" y="28" fill="#06b6d4" font-size="11" font-weight="800" letter-spacing="1">LAYER 1: MULTI-SOURCE CONTINUOUS INGESTION (8 CONNECTORS)</text>
    <text x="24" y="46" fill="#64748b" font-size="12">Autonomous scheduler with PostgreSQL advisory locking, exponential backoff, and Bronze WORM persistence</text>

    <!-- Source Pills -->
    <g transform="translate(24, 62)">
      <!-- PubMed -->
      <rect x="0" y="0" width="118" height="42" rx="8" fill="#0f1f38" stroke="#0284c7" stroke-width="1"/>
      <text x="12" y="20" fill="#38bdf8" font-size="11" font-weight="700">NCBI PubMed</text>
      <text x="12" y="34" fill="#64748b" font-size="9">E-Utilities / Medline</text>

      <!-- ClinicalTrials.gov -->
      <rect x="128" y="0" width="128" height="42" rx="8" fill="#0f1f38" stroke="#0284c7" stroke-width="1"/>
      <text x="140" y="20" fill="#38bdf8" font-size="11" font-weight="700">ClinicalTrials.gov</text>
      <text x="140" y="34" fill="#64748b" font-size="9">REST API v2</text>

      <!-- OpenFDA -->
      <rect x="266" y="0" width="115" height="42" rx="8" fill="#0f1f38" stroke="#0284c7" stroke-width="1"/>
      <text x="278" y="20" fill="#38bdf8" font-size="11" font-weight="700">OpenFDA</text>
      <text x="278" y="34" fill="#64748b" font-size="9">Drugs@FDA / FAERS</text>

      <!-- EMA -->
      <rect x="391" y="0" width="110" height="42" rx="8" fill="#0f1f38" stroke="#0284c7" stroke-width="1"/>
      <text x="403" y="20" fill="#38bdf8" font-size="11" font-weight="700">EMA EPAR</text>
      <text x="403" y="34" fill="#64748b" font-size="9">European Dossiers</text>

      <!-- Fierce Pharma -->
      <rect x="511" y="0" width="122" height="42" rx="8" fill="#0f1f38" stroke="#0284c7" stroke-width="1"/>
      <text x="523" y="20" fill="#38bdf8" font-size="11" font-weight="700">Fierce Pharma</text>
      <text x="523" y="34" fill="#64748b" font-size="9">RSS Industry Wire</text>

      <!-- BioPharma Dive -->
      <rect x="643" y="0" width="128" height="42" rx="8" fill="#0f1f38" stroke="#0284c7" stroke-width="1"/>
      <text x="655" y="20" fill="#38bdf8" font-size="11" font-weight="700">BioPharma Dive</text>
      <text x="655" y="34" fill="#64748b" font-size="9">Biotech Pipeline</text>

      <!-- ET Pharma -->
      <rect x="781" y="0" width="115" height="42" rx="8" fill="#0f1f38" stroke="#0284c7" stroke-width="1"/>
      <text x="793" y="20" fill="#38bdf8" font-size="11" font-weight="700">ET Healthworld</text>
      <text x="793" y="34" fill="#64748b" font-size="9">Global Regulatory</text>

      <!-- NewsAPI -->
      <rect x="906" y="0" width="124" height="42" rx="8" fill="#0f1f38" stroke="#0284c7" stroke-width="1"/>
      <text x="918" y="20" fill="#38bdf8" font-size="11" font-weight="700">NewsAPI</text>
      <text x="918" y="34" fill="#64748b" font-size="9">Quota-Governed Feed</text>
    </g>
  </g>

  <!-- Connective Arrows Layer 1 -> Layer 2 -->
  <path d="M 600 250 L 600 280" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="600,285 595,275 605,275" fill="#06b6d4"/>

  <!-- LAYER 2: LANGGRAPH 10-NODE INTELLIGENCE ORCHESTRATION -->
  <g transform="translate(60, 290)">
    <rect x="0" y="0" width="1080" height="190" rx="16" fill="#0b1324" stroke="#1e293b" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="6" height="190" rx="3" fill="#14b8a6"/>
    
    <text x="24" y="26" fill="#14b8a6" font-size="11" font-weight="800" letter-spacing="1">LAYER 2: LANGGRAPH 10-NODE STATEFUL INTELLIGENCE PIPELINE</text>
    <text x="24" y="44" fill="#64748b" font-size="12">StateGraph DAG executing deterministic entity extraction, ontology mapping, confluence, contradiction &amp; 4-factor scoring</text>

    <!-- Node Matrix (Top Row 5, Bottom Row 5) -->
    <g transform="translate(24, 60)">
      <!-- Node 1: Ingest -->
      <rect x="0" y="0" width="195" height="50" rx="8" fill="#132338" stroke="#0f766e" stroke-width="1"/>
      <text x="12" y="20" fill="#2dd4bf" font-size="11" font-weight="700">1. node_ingest</text>
      <text x="12" y="36" fill="#94a3b8" font-size="9.5">Bronze fetch &amp; dedup</text>

      <!-- Node 2: Validate -->
      <rect x="208" y="0" width="195" height="50" rx="8" fill="#132338" stroke="#0f766e" stroke-width="1"/>
      <text x="220" y="20" fill="#2dd4bf" font-size="11" font-weight="700">2. node_validate</text>
      <text x="220" y="36" fill="#94a3b8" font-size="9.5">PII/PHI Regex &amp; NER scrub</text>

      <!-- Node 3: NLP Extract -->
      <rect x="416" y="0" width="195" height="50" rx="8" fill="#132338" stroke="#0f766e" stroke-width="1"/>
      <text x="428" y="20" fill="#2dd4bf" font-size="11" font-weight="700">3. node_nlp_extract</text>
      <text x="428" y="36" fill="#94a3b8" font-size="9.5">5-dim clinical entity parse</text>

      <!-- Node 4: Ontology Enrich -->
      <rect x="624" y="0" width="195" height="50" rx="8" fill="#132338" stroke="#0f766e" stroke-width="1"/>
      <text x="636" y="20" fill="#2dd4bf" font-size="11" font-weight="700">4. node_ontology_enrich</text>
      <text x="636" y="36" fill="#94a3b8" font-size="9.5">Haemophilia YAML mapping</text>

      <!-- Node 5: Embed & Vectorize -->
      <rect x="832" y="0" width="200" height="50" rx="8" fill="#132338" stroke="#0f766e" stroke-width="1"/>
      <text x="844" y="20" fill="#2dd4bf" font-size="11" font-weight="700">5. node_embed</text>
      <text x="844" y="36" fill="#94a3b8" font-size="9.5">384-dim MiniLM-L6 vector</text>

      <!-- Bottom Row -->
      <!-- Node 6: Confluence -->
      <rect x="0" y="62" width="195" height="50" rx="8" fill="#132338" stroke="#0f766e" stroke-width="1"/>
      <text x="12" y="82" fill="#2dd4bf" font-size="11" font-weight="700">6. node_confluence</text>
      <text x="12" y="98" fill="#94a3b8" font-size="9.5">48h multi-source cluster</text>

      <!-- Node 7: Lifecycle -->
      <rect x="208" y="62" width="195" height="50" rx="8" fill="#132338" stroke="#0f766e" stroke-width="1"/>
      <text x="220" y="82" fill="#2dd4bf" font-size="11" font-weight="700">7. node_lifecycle</text>
      <text x="220" y="98" fill="#94a3b8" font-size="9.5">7-stage timeline progression</text>

      <!-- Node 8: Red-Team -->
      <rect x="416" y="62" width="195" height="50" rx="8" fill="#132338" stroke="#0f766e" stroke-width="1"/>
      <text x="428" y="82" fill="#2dd4bf" font-size="11" font-weight="700">8. node_redteam</text>
      <text x="428" y="98" fill="#94a3b8" font-size="9.5">BART-MNLI contradiction</text>

      <!-- Node 9: Missing Signal -->
      <rect x="624" y="62" width="195" height="50" rx="8" fill="#132338" stroke="#0f766e" stroke-width="1"/>
      <text x="636" y="82" fill="#2dd4bf" font-size="11" font-weight="700">9. node_missing_signal</text>
      <text x="636" y="98" fill="#94a3b8" font-size="9.5">Milestone silence FSM</text>

      <!-- Node 10: Synthesize -->
      <rect x="832" y="62" width="200" height="50" rx="8" fill="#132338" stroke="#0f766e" stroke-width="1"/>
      <text x="844" y="82" fill="#2dd4bf" font-size="11" font-weight="700">10. node_synthesize</text>
      <text x="844" y="98" fill="#94a3b8" font-size="9.5">4-Q brief + Epistemic tags</text>
    </g>
  </g>

  <!-- Connective Arrows Layer 2 -> Layer 3 -->
  <path d="M 600 480 L 600 510" stroke="#14b8a6" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="600,515 595,505 605,505" fill="#14b8a6"/>

  <!-- LAYER 3: STORAGE, AI INFERENCE & SECURITY -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="1080" height="110" rx="16" fill="#0b1324" stroke="#1e293b" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#8b5cf6"/>
    
    <text x="24" y="26" fill="#a78bfa" font-size="11" font-weight="800" letter-spacing="1">LAYER 3: HYBRID AI REASONING, VECTOR RETRIEVAL &amp; SECURITY GUARANTEES</text>
    
    <g transform="translate(24, 42)">
      <!-- PostgreSQL + pgvector -->
      <rect x="0" y="0" width="245" height="52" rx="8" fill="#1e1838" stroke="#7c3aed" stroke-width="1"/>
      <text x="14" y="22" fill="#c4b5fd" font-size="11" font-weight="700">PostgreSQL 16 + pgvector</text>
      <text x="14" y="38" fill="#94a3b8" font-size="9.5">22 Relational Tables + HNSW Index</text>

      <!-- Local Gemma LLM -->
      <rect x="260" y="0" width="250" height="52" rx="8" fill="#1e1838" stroke="#7c3aed" stroke-width="1"/>
      <text x="274" y="22" fill="#c4b5fd" font-size="11" font-weight="700">Local Gemma 3 4B GGUF</text>
      <text x="274" y="38" fill="#94a3b8" font-size="9.5">100% Offline Air-Gapped Inference</text>

      <!-- xAI Grok Privacy Gate -->
      <rect x="525" y="0" width="255" height="52" rx="8" fill="#1e1838" stroke="#7c3aed" stroke-width="1"/>
      <text x="539" y="22" fill="#c4b5fd" font-size="11" font-weight="700">xAI Grok Privacy Gate</text>
      <text x="539" y="38" fill="#94a3b8" font-size="9.5">Public Data Only · Zero PHI Leaks</text>

      <!-- Immutable WORM Audit Log -->
      <rect x="795" y="0" width="235" height="52" rx="8" fill="#1e1838" stroke="#7c3aed" stroke-width="1"/>
      <text x="809" y="22" fill="#c4b5fd" font-size="11" font-weight="700">Immutable WORM Audit</text>
      <text x="809" y="38" fill="#94a3b8" font-size="9.5">Postgres Trigger Blocks Mutation</text>
    </g>
  </g>

  <!-- Connective Arrows Layer 3 -> Layer 4 -->
  <path d="M 600 630 L 600 655" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="600,660 595,650 605,650" fill="#8b5cf6"/>

  <!-- LAYER 4: NEXT.JS 16 EXECUTIVE DASHBOARD -->
  <g transform="translate(60, 665)">
    <rect x="0" y="0" width="1080" height="105" rx="16" fill="#0b1324" stroke="#1e293b" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="6" height="105" rx="3" fill="#f59e0b"/>
    
    <text x="24" y="24" fill="#fbbf24" font-size="11" font-weight="800" letter-spacing="1">LAYER 4: NEXT.JS 16 ENTERPRISE WORKSPACES &amp; DECISION GOVERNANCE (13 WORKSPACES)</text>
    
    <g transform="translate(24, 38)">
      <!-- Workspaces Group -->
      <rect x="0" y="0" width="410" height="52" rx="8" fill="#291e10" stroke="#d97706" stroke-width="1"/>
      <text x="14" y="20" fill="#fcd34d" font-size="11" font-weight="700">Role-Scoped Workspaces (6 Personas)</text>
      <text x="14" y="36" fill="#94a3b8" font-size="9.5">Medical Affairs · Regulatory · Safety/PV · Access · Comms · Leadership</text>

      <!-- Athena Copilot -->
      <rect x="425" y="0" width="310" height="52" rx="8" fill="#291e10" stroke="#d97706" stroke-width="1"/>
      <text x="439" y="20" fill="#fcd34d" font-size="11" font-weight="700">Athena Copilot (SSE Streaming)</text>
      <text x="439" y="36" fill="#94a3b8" font-size="9.5">Clickable Citations · Natural Language Grounding</text>

      <!-- HITL Calibration & Approval FSM -->
      <rect x="750" y="0" width="280" height="52" rx="8" fill="#291e10" stroke="#d97706" stroke-width="1"/>
      <text x="764" y="20" fill="#fcd34d" font-size="11" font-weight="700">Governance &amp; HITL Calibration</text>
      <text x="764" y="36" fill="#94a3b8" font-size="9.5">Executive Sign-Off · Dynamic Weight Tuning</text>
    </g>
  </g>

</svg>
