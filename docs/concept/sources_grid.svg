<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" style="background-color: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="src-hdr-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>
    <filter id="sh-src" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title Header Bar -->
  <rect x="15" y="8" width="1070" height="32" rx="6" fill="url(#src-hdr-grad)" filter="url(#sh-src)"/>
  <text x="30" y="29" fill="#FFFFFF" font-size="14" font-weight="800" letter-spacing="0.5">EXTERNAL SIGNAL SOURCES — LANDSCAPE &amp; PROTOTYPE MONITORING</text>
  <text x="1070" y="29" fill="#38BDF8" font-size="10" font-weight="700" text-anchor="end" dx="-15">Public · API-Accessible · Synthetic</text>

  <!-- Grid Container: 2 Rows x 3 Columns -->
  <!-- Row 1: Live Prototype Connectors -->
  <!-- Card 1: Scientific Literature -->
  <g transform="translate(15, 48)">
    <rect x="0" y="0" width="346" height="74" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#sh-src)"/>
    <rect x="0" y="0" width="346" height="20" rx="6" fill="#1E3E62"/>
    <text x="12" y="14" fill="#FFFFFF" font-size="10" font-weight="800">1. SCIENTIFIC LITERATURE</text>
    <rect x="236" y="3" width="102" height="14" rx="3" fill="#10B981"/>
    <text x="287" y="13" fill="#FFFFFF" font-size="8" font-weight="800" text-anchor="middle">LIVE PROTOTYPE</text>
    <text x="12" y="36" fill="#0F172A" font-size="11" font-weight="700">PubMed / NCBI API · Peer-Reviewed Journals</text>
    <text x="12" y="52" fill="#475569" font-size="10">Clinical evidence, trial readouts &amp; medical literature</text>
    <text x="12" y="65" fill="#64748B" font-size="9" font-style="italic">Coverage: Haemophilia A/B &amp; novel mechanisms</text>
  </g>

  <!-- Card 2: Clinical Trials -->
  <g transform="translate(377, 48)">
    <rect x="0" y="0" width="346" height="74" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#sh-src)"/>
    <rect x="0" y="0" width="346" height="20" rx="6" fill="#1E3E62"/>
    <text x="12" y="14" fill="#FFFFFF" font-size="10" font-weight="800">2. CLINICAL TRIALS</text>
    <rect x="236" y="3" width="102" height="14" rx="3" fill="#10B981"/>
    <text x="287" y="13" fill="#FFFFFF" font-size="8" font-weight="800" text-anchor="middle">LIVE PROTOTYPE</text>
    <text x="12" y="36" fill="#0F172A" font-size="11" font-weight="700">ClinicalTrials.gov API v2 Registry</text>
    <text x="12" y="52" fill="#475569" font-size="10">Trial status, phases, endpoints, completion dates</text>
    <text x="12" y="65" fill="#64748B" font-size="9" font-style="italic">Tracking: Emicizumab, Concizumab, Mim8, AAV</text>
  </g>

  <!-- Card 3: Pharma & Industry News -->
  <g transform="translate(739, 48)">
    <rect x="0" y="0" width="346" height="74" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#sh-src)"/>
    <rect x="0" y="0" width="346" height="20" rx="6" fill="#1E3E62"/>
    <text x="12" y="14" fill="#FFFFFF" font-size="10" font-weight="800">3. PHARMA &amp; INDUSTRY NEWS</text>
    <rect x="236" y="3" width="102" height="14" rx="3" fill="#10B981"/>
    <text x="287" y="13" fill="#FFFFFF" font-size="8" font-weight="800" text-anchor="middle">LIVE PROTOTYPE</text>
    <text x="12" y="36" fill="#0F172A" font-size="11" font-weight="700">NewsAPI / Public News &amp; Press Releases</text>
    <text x="12" y="52" fill="#475569" font-size="10">Corporate announcements, approvals &amp; pipeline news</text>
    <text x="12" y="65" fill="#64748B" font-size="9" font-style="italic">Monitored: Public pharma &amp; biotech announcements</text>
  </g>

  <!-- Row 2: Planned & Simulated Sources -->
  <!-- Card 4: Medical Congresses -->
  <g transform="translate(15, 130)">
    <rect x="0" y="0" width="346" height="74" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#sh-src)"/>
    <rect x="0" y="0" width="346" height="20" rx="6" fill="#334155"/>
    <text x="12" y="14" fill="#FFFFFF" font-size="10" font-weight="800">4. MEDICAL CONGRESSES</text>
    <rect x="216" y="3" width="122" height="14" rx="3" fill="#0EA5E9"/>
    <text x="277" y="13" fill="#FFFFFF" font-size="8" font-weight="800" text-anchor="middle">PLANNED / SIMULATED</text>
    <text x="12" y="36" fill="#0F172A" font-size="11" font-weight="700">ASH · ISTH · WFH Congress Abstracts</text>
    <text x="12" y="52" fill="#475569" font-size="10">Late-breaking disclosures &amp; oral presentations</text>
    <text x="12" y="65" fill="#64748B" font-size="9" font-style="italic">Status: Ingested via synthetic &amp; mock disclosures</text>
  </g>

  <!-- Card 5: Regulatory & Safety -->
  <g transform="translate(377, 130)">
    <rect x="0" y="0" width="346" height="74" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#sh-src)"/>
    <rect x="0" y="0" width="346" height="20" rx="6" fill="#334155"/>
    <text x="12" y="14" fill="#FFFFFF" font-size="10" font-weight="800">5. REGULATORY &amp; SAFETY</text>
    <rect x="216" y="3" width="122" height="14" rx="3" fill="#0EA5E9"/>
    <text x="277" y="13" fill="#FFFFFF" font-size="8" font-weight="800" text-anchor="middle">PLANNED / SIMULATED</text>
    <text x="12" y="36" fill="#0F172A" font-size="11" font-weight="700">FDA / EMA / MHRA Public Releases</text>
    <text x="12" y="52" fill="#475569" font-size="10">Public regulatory decisions, safety alerts &amp; labels</text>
    <text x="12" y="65" fill="#64748B" font-size="9" font-style="italic">Status: Public announcements &amp; synthetic signals</text>
  </g>

  <!-- Card 6: Patient, Access & Market -->
  <g transform="translate(739, 130)">
    <rect x="0" y="0" width="346" height="74" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#sh-src)"/>
    <rect x="0" y="0" width="346" height="20" rx="6" fill="#334155"/>
    <text x="12" y="14" fill="#FFFFFF" font-size="10" font-weight="800">6. PATIENT, ACCESS &amp; MARKET</text>
    <rect x="216" y="3" width="122" height="14" rx="3" fill="#0EA5E9"/>
    <text x="277" y="13" fill="#FFFFFF" font-size="8" font-weight="800" text-anchor="middle">PLANNED / SIMULATED</text>
    <text x="12" y="36" fill="#0F172A" font-size="11" font-weight="700">Public Patient &amp; Access Narratives</text>
    <text x="12" y="52" fill="#475569" font-size="10">Reimbursement decisions &amp; market dynamics</text>
    <text x="12" y="65" fill="#64748B" font-size="9" font-style="italic">Status: Public narratives &amp; synthetic data feed</text>
  </g>

  <!-- Footer Note Box -->
  <rect x="15" y="212" width="1070" height="26" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="25" y="229" fill="#1D4ED8" font-size="10" font-weight="600">* Prototype data uses public, synthetic, or permitted external information. Source availability and update frequency may vary by provider.</text>
  <text x="1070" y="229" fill="#1E40AF" font-size="9" font-weight="700" text-anchor="end" dx="-25">Demo Dataset: 500 Source-Linked Signals</text>
</svg>