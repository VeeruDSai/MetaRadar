  <g filter="url(#cardShadow2)">
    <rect x="20" y="253" width="480" height="74" rx="7" fill="#EEF5F8" stroke="#087EA4" stroke-width="1.8"/>
    <rect x="20" y="253" width="480" height="22" rx="7" fill="#087EA4"/>
