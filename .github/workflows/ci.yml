name: MetaRadar CI

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-verify:
    name: Backend Pytest, Contract Sync & Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: metaradar
          POSTGRES_PASSWORD: metaradar_pass
          POSTGRES_DB: metaradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metaradar -d metaradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Database Migrations & Seeding
        env:
          PYTHONPATH: backend:.
          DATABASE_URL: postgresql+asyncpg://metaradar:metaradar_pass@localhost:5432/metaradar
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          alembic upgrade head
          cd ..
          python backend/app/db/seed.py

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: backend:.
          DATABASE_URL: postgresql+asyncpg://metaradar:metaradar_pass@localhost:5432/metaradar
          REDIS_URL: redis://localhost:6379/0
          LLM_PROVIDER: local
        run: |
          pytest -v

      - name: Verify TypeScript Contract Canonical Copy Is Unchanged
        env:
          PYTHONPATH: backend:.
        run: |
          python scripts/export_openapi.py
          git diff --exit-code frontend/types/api.ts || (echo "frontend/types/api.ts differs from the canonical template in scripts/export_openapi.py — edit the template, then run python scripts/export_openapi.py" && exit 1)

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend Typecheck, Lint, Banned Class Gate & Build
        run: |
          cd frontend
          pnpm install --frozen-lockfile=false
          pnpm exec tsc --noEmit
          pnpm run check:banned-classes
          pnpm lint
          pnpm build
