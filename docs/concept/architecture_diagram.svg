<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%" style="background-color: #FFFFFF; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#143B5D"/>
      <stop offset="100%" stop-color="#087EA4"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#143B5D" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#087EA4"/>
    </marker>
  </defs>

  <!-- Title Card -->
  <rect x="15" y="12" width="470" height="38" rx="6" fill="url(#headerGrad)"/>
  <text x="250" y="36" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="0.5">METARADAR SYSTEM ARCHITECTURE</text>

  <!-- Layer 1: Ingestion -->
  <g filter="url(#shadow)">
    <rect x="25" y="65" width="450" height="55" rx="8" fill="#EEF5F8" stroke="#C8D7DE" stroke-width="1.5"/>
    <rect x="35" y="73" width="90" height="20" rx="4" fill="#143B5D"/>
    <text x="80" y="87" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">INGESTION</text>
    <text x="260" y="87" text-anchor="middle" fill="#263238" font-size="11" font-weight="600">ClinicalTrials.gov • PubMed NCBI • NewsAPI • OpenFDA RSS</text>
    <text x="250" y="107" text-anchor="middle" fill="#68767E" font-size="9.5">Automated Connectors • Incremental Fetching • Raw Bronze Storage</text>
  </g>

  <line x1="250" y1="120" x2="250" y2="137" stroke="#087EA4" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Layer 2: Core Processing & Storage -->
  <g filter="url(#shadow)">
    <rect x="25" y="142" width="450" height="60" rx="8" fill="#EEF5F8" stroke="#087EA4" stroke-width="1.8"/>
    <rect x="35" y="150" width="90" height="20" rx="4" fill="#087EA4"/>
    <text x="80" y="164" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">BACKEND</text>
    <text x="260" y="165" text-anchor="middle" fill="#143B5D" font-size="12" font-weight="700">Python 3.11 FastAPI + PostgreSQL 16 (pgvector)</text>
    <text x="250" y="187" text-anchor="middle" fill="#263238" font-size="9.5">Entity Normalization • Canonical De-duplication • Relational &amp; Vector Indexing</text>
  </g>

  <line x1="250" y1="202" x2="250" y2="219" stroke="#087EA4" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: AI / LLM Engine -->
  <g filter="url(#shadow)">
    <rect x="25" y="224" width="450" height="58" rx="8" fill="#EEF5F8" stroke="#C8D7DE" stroke-width="1.5"/>
    <rect x="35" y="232" width="90" height="20" rx="4" fill="#143B5D"/>
    <text x="80" y="246" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">AI ENGINE</text>
    <text x="260" y="246" text-anchor="middle" fill="#143B5D" font-size="11.5" font-weight="700">Local Gemma 2 / Llama 3 Evidence RAG Pipeline</text>
    <text x="250" y="267" text-anchor="middle" fill="#68767E" font-size="9.5">Grounded Summarization • Strategic Priority Scoring • Role-Based Auto-Routing</text>
  </g>

  <line x1="250" y1="282" x2="250" y2="299" stroke="#087EA4" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Layer 4: Executive UI -->
  <g filter="url(#shadow)">
    <rect x="25" y="304" width="450" height="48" rx="8" fill="#143B5D" stroke="#143B5D" stroke-width="1.5"/>
    <text x="250" y="324" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">Next.js 16 Executive Intelligence Dashboard</text>
    <text x="250" y="341" text-anchor="middle" fill="#EEF5F8" font-size="9.5">Medical Affairs • Regulatory • Safety / PV • Market Access • Leadership Views</text>
  </g>
</svg>
