<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="100%" height="100%" style="background-color: #FFFFFF; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#143B5D"/>
      <stop offset="100%" stop-color="#087EA4"/>
    </linearGradient>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#143B5D" flood-opacity="0.10"/>
    </filter>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#087EA4"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="15" y="12" width="490" height="38" rx="6" fill="url(#hdrGrad)"/>
  <text x="260" y="36" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="700" letter-spacing="0.5">METARADAR v5.1 ARCHITECTURE DIAGRAM</text>

  <!-- Layer 1: Data Ingestion & Bronze Storage -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="65" width="480" height="74" rx="7" fill="#EEF5F8" stroke="#C8D7DE" stroke-width="1.5"/>
    <rect x="20" y="65" width="480" height="22" rx="7" fill="#143B5D"/>
    <!-- Fix rounded bottom overlap -->
    <rect x="20" y="77" width="480" height="10" fill="#143B5D"/>
    <text x="32" y="80" fill="#FFFFFF" font-size="10" font-weight="700" letter-spacing="0.3">1. INGESTION &amp; BRONZE STORAGE</text>
    <text x="260" y="102" text-anchor="middle" fill="#263238" font-size="10.5" font-weight="600">ClinicalTrials.gov • PubMed NCBI • NewsAPI • OpenFDA RSS Feeds</text>
    <text x="260" y="123" text-anchor="middle" fill="#68767E" font-size="9.5">Async Connectors • Incremental Fetching • Raw Signal Persistence (raw_signals_bronze)</text>
  </g>

  <line x1="260" y1="139" x2="260" y2="154" stroke="#087EA4" stroke-width="2.5" marker-end="url(#blueArrow)"/>

  <!-- Layer 2: Core Processing & Database -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="159" width="480" height="76" rx="7" fill="#EEF5F8" stroke="#087EA4" stroke-width="1.8"/>
    <rect x="20" y="159" width="480" height="22" rx="7" fill="#087EA4"/>
    <rect x="20" y="171" width="480" height="10" fill="#087EA4"/>
    <text x="32" y="174" fill="#FFFFFF" font-size="10" font-weight="700" letter-spacing="0.3">2. FASTAPI BACKEND &amp; POSTGRESQL 16</text>
    <text x="260" y="196" text-anchor="middle" fill="#143B5D" font-size="11" font-weight="700">Python 3.11 FastAPI + PostgreSQL 16 (pgvector)</text>
    <text x="260" y="217" text-anchor="middle" fill="#263238" font-size="9.5">Entity Normalization • Canonical Deduplication (cross_source_group_id) • Relational &amp; Vector Storage</text>
  </g>

  <line x1="260" y1="235" x2="260" y2="250" stroke="#087EA4" stroke-width="2.5" marker-end="url(#blueArrow)"/>

  <!-- Layer 3: AI Intelligence Engine -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="255" width="480" height="74" rx="7" fill="#EEF5F8" stroke="#C8D7DE" stroke-width="1.5"/>
    <rect x="20" y="255" width="480" height="22" rx="7" fill="#143B5D"/>
    <rect x="20" y="267" width="480" height="10" fill="#143B5D"/>
    <text x="32" y="270" fill="#FFFFFF" font-size="10" font-weight="700" letter-spacing="0.3">3. LOCAL AI / LLM RAG ENGINE</text>
    <text x="260" y="292" text-anchor="middle" fill="#143B5D" font-size="11" font-weight="700">Local Gemma 2 / Llama 3 + Grok Privacy Gate Fallback</text>
    <text x="260" y="313" text-anchor="middle" fill="#68767E" font-size="9.5">Grounded Summarization • Strategic Priority Scoring • Functional Auto-Routing</text>
  </g>

  <line x1="260" y1="329" x2="260" y2="344" stroke="#087EA4" stroke-width="2.5" marker-end="url(#blueArrow)"/>

  <!-- Layer 4: Executive UI -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="349" width="480" height="76" rx="7" fill="#143B5D" stroke="#143B5D" stroke-width="1.5"/>
    <rect x="20" y="349" width="480" height="22" rx="7" fill="#087EA4"/>
    <rect x="20" y="361" width="480" height="10" fill="#087EA4"/>
    <text x="32" y="364" fill="#FFFFFF" font-size="10" font-weight="700" letter-spacing="0.3">4. NEXT.JS 16 EXECUTIVE DASHBOARD</text>
    <text x="260" y="387" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">Next.js 16 App Router (React 19, TailwindCSS)</text>
    <text x="260" y="408" text-anchor="middle" fill="#EEF5F8" font-size="9.5">Medical Affairs • Regulatory • PV / Safety • Access • Leadership Views • Calibration Loop</text>
  </g>
</svg>
