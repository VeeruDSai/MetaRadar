  </defs>

  <!-- Title Banner -->
  <rect x="15" y="12" width="490" height="38" rx="6" fill="url(#hdrGrad2)"/>
  <text x="260" y="36" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="700" letter-spacing="0.5">4-WEEK PROTOTYPE DEVELOPMENT TIMELINE</text>

