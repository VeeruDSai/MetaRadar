<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380" style="background-color: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="cal-hdr-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>
    <filter id="sh-cal" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="15" y="10" width="1070" height="44" rx="7" fill="url(#cal-hdr-grad)" filter="url(#sh-cal)"/>
  <text x="30" y="34" fill="#FFFFFF" font-size="19" font-weight="800" letter-spacing="0.5">METARADAR STAKEHOLDER CALIBRATION LEARNING LOOP</text>
  <text x="30" y="47" fill="#10B981" font-size="11" font-weight="700">Mechanism 5: Human-in-the-Loop Feedback Adapts Relevance, Routing, and Action Logic</text>

  <!-- Top Closed-Loop Diagram -->
  <g transform="translate(15, 60)">
    <rect x="0" y="0" width="1070" height="78" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#sh-cal)"/>
    <text x="14" y="14" fill="#0F172A" font-size="10" font-weight="800" letter-spacing="0.5">CLOSED-LOOP FEEDBACK MECHANISM</text>

    <!-- Node 1 -->
    <rect x="14" y="19" width="165" height="46" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="96.5" y="37" fill="#0F172A" font-size="12" font-weight="800" text-anchor="middle">External Signal</text>
    <text x="96.5" y="52" fill="#64748B" font-size="10" text-anchor="middle">PubMed / News</text>

    <line x1="179" y1="42" x2="208" y2="42" stroke="#475569" stroke-width="2" marker-end="url(#arr-dark)"/>

    <!-- Node 2 -->
    <rect x="208" y="19" width="165" height="46" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="290.5" y="37" fill="#0F172A" font-size="12" font-weight="800" text-anchor="middle">AI Baseline</text>
    <text x="290.5" y="52" fill="#64748B" font-size="10" text-anchor="middle">Default Routing</text>

    <line x1="373" y1="42" x2="402" y2="42" stroke="#475569" stroke-width="2" marker-end="url(#arr-dark)"/>

    <!-- Node 3 -->
    <rect x="402" y="19" width="180" height="46" rx="5" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="492" y="37" fill="#1E40AF" font-size="12" font-weight="800" text-anchor="middle">Stakeholder Review</text>
    <text x="492" y="52" fill="#1D4ED8" font-size="10" text-anchor="middle">Domain Experts</text>

    <line x1="582" y1="42" x2="611" y2="42" stroke="#475569" stroke-width="2" marker-end="url(#arr-dark)"/>

    <!-- Node 4 -->
    <rect x="611" y="19" width="180" height="46" rx="5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="701" y="35" fill="#92400E" font-size="11" font-weight="800" text-anchor="middle">Stakeholder Feedback</text>
    <text x="701" y="50" fill="#B45309" font-size="10" text-anchor="middle">Relevance · Urgency · Routing · Action</text>

    <line x1="791" y1="42" x2="820" y2="42" stroke="#475569" stroke-width="2" marker-end="url(#arr-dark)"/>

    <!-- Node 5 -->
    <rect x="820" y="19" width="236" height="46" rx="5" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="938" y="35" fill="#065F46" font-size="12" font-weight="800" text-anchor="middle">Calibration Logic</text>
    <text x="938" y="50" fill="#047857" font-size="10" text-anchor="middle">Refined Relevance, Routing &amp; Action Rules</text>
  </g>

  <!-- Bottom Side-by-Side Comparison Panel -->
  <g transform="translate(15, 145)">
    <rect x="0" y="0" width="1070" height="225" rx="7" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh-cal)"/>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="1070" height="24" rx="7" fill="#0F172A"/>
    <text x="16" y="16" fill="#FFFFFF" font-size="11" font-weight="800" letter-spacing="0.5">BEFORE VS AFTER STAKEHOLDER CALIBRATION</text>
    <rect x="815" y="3" width="240" height="18" rx="4" fill="#F59E0B"/>
    <text x="935" y="16" fill="#78350F" font-size="10" font-weight="800" text-anchor="middle">ILLUSTRATIVE EXAMPLE</text>

    <!-- Context Signal Box -->
    <rect x="14" y="30" width="1042" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="24" y="46" fill="#0F172A" font-size="11" font-weight="800">INCOMING SIGNAL:</text>
    <text x="140" y="46" fill="#334155" font-size="11">Competitor Phase III Trial Update (Hemgenix 3-Year Durability Readout)</text>

    <!-- Column Left: Pre-Calibration Baseline -->
    <rect x="14" y="60" width="510" height="152" rx="5" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
    <rect x="14" y="60" width="510" height="22" rx="5" fill="#EF4444"/>
    <text x="269" y="75" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">BEFORE STAKEHOLDER INPUT (AI Baseline)</text>

    <text x="24" y="98" fill="#991B1B" font-size="11" font-weight="800">Priority Assessment:</text>
    <text x="24" y="113" fill="#7F1D1D" font-size="11">High Competitor Relevance (Generic)</text>

    <text x="24" y="136" fill="#991B1B" font-size="11" font-weight="800">Function Routing:</text>
    <text x="24" y="151" fill="#7F1D1D" font-size="11">Unfiltered Broadcast to All Functions</text>

    <text x="24" y="174" fill="#991B1B" font-size="11" font-weight="800">Suggested Internal Action:</text>
    <text x="24" y="189" fill="#7F1D1D" font-size="11">"Review clinical publication data"</text>

    <!-- Column Right: Post-Calibration Output -->
    <rect x="546" y="60" width="510" height="152" rx="5" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="546" y="60" width="510" height="22" rx="5" fill="#10B981"/>
    <text x="801" y="75" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">AFTER STAKEHOLDER INPUT (Calibrated Output)</text>

    <text x="556" y="98" fill="#065F46" font-size="11" font-weight="800">Targeted Priority &amp; Relevance:</text>
    <text x="556" y="113" fill="#047857" font-size="11">Targeted Focus (Medical Affairs &amp; Regulatory)</text>

    <text x="556" y="136" fill="#065F46" font-size="11" font-weight="800">Function Routing:</text>
    <text x="556" y="151" fill="#047857" font-size="11">Primary: Medical Affairs | Secondary: Regulatory</text>

    <text x="556" y="174" fill="#065F46" font-size="11" font-weight="800">Function-Specific Action:</text>
    <text x="556" y="189" fill="#047857" font-size="11">"Medical Affairs: prepare an internal evidence review;</text>
    <text x="556" y="202" fill="#047857" font-size="11">monitor upcoming congress data; avoid unsupported comparisons."</text>
  </g>
</svg>