services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: metaradar-postgres
    restart: always
    environment:
      POSTGRES_USER: metaradar
      POSTGRES_PASSWORD: metaradar_pass
      POSTGRES_DB: metaradar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaradar -d metaradar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: metaradar-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metaradar-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://metaradar:metaradar_pass@postgres:5432/metaradar
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=local
      - LLM_DEVICE=cpu
      - OLLAMA_HOST=http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - models_cache:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend-gpu:
    profiles: ["gpu"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metaradar-backend-gpu
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://metaradar:metaradar_pass@postgres:5432/metaradar
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=local
      - LLM_DEVICE=cuda:0
      - OLLAMA_HOST=http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - models_cache:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metaradar-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Ollama sidecar -- hosts Gemma 3 4B (Q4 int4) for local LLM inference (D-09, D-10)
  # On first run: docker exec metaradar-ollama ollama pull gemma3:4b
  # VRAM budget: ~2.8 GB weights + KV cache fits RTX 3050 4 GB (MAX_CONTEXT_TOKENS=2048)
  ollama:
    image: ollama/ollama:latest
    container_name: metaradar-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  models_cache:
  ollama_models:
