<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="crossLight" x1="50" y1="50" x2="130" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="sweepLight" x1="90" y1="90" x2="155" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="180" height="180" rx="42" fill="url(#bgLight)"/>
  <rect x="1" y="1" width="178" height="178" rx="41" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Radar Concentric Rings (Thick & Prominent) -->
  <circle cx="90" cy="90" r="66" stroke="#475569" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="6 6"/>
  <circle cx="90" cy="90" r="46" stroke="#334155" stroke-width="3" stroke-opacity="0.55"/>
  <circle cx="90" cy="90" r="26" stroke="#0f172a" stroke-width="3" stroke-opacity="0.7"/>

  <!-- Radar Crosshairs -->
  <line x1="90" y1="18" x2="90" y2="162" stroke="#475569" stroke-width="2.5" stroke-opacity="0.45" stroke-linecap="round"/>
  <line x1="18" y1="90" x2="162" y2="90" stroke="#475569" stroke-width="2.5" stroke-opacity="0.45" stroke-linecap="round"/>

  <!-- Radar Sweep Arc -->
  <path d="M 90 90 L 148 42 A 66 66 0 0 0 90 24 Z" fill="url(#sweepLight)"/>

  <!-- Sleek, Refined Medical Plus Icon (20px bar thickness, 80px span) -->
  <path d="
    M 80 50
    C 80 46, 84 42, 90 42
    C 96 42, 100 46, 100 50
    L 100 80
    L 130 80
    C 134 80, 138 84, 138 90
    C 138 96, 134 100, 130 100
    L 100 100
    L 100 130
    C 100 134, 96 138, 90 138
    C 84 138, 80 134, 80 130
    L 80 100
    L 50 100
    C 46 100, 42 96, 42 90
    C 42 84, 46 80, 50 80
    L 80 80
    Z
  " fill="url(#crossLight)" filter="drop-shadow(0 2px 6px rgba(225, 29, 72, 0.35))"/>

  <!-- Inner Plus Shimmer Line -->
  <path d="
    M 88 52
    L 92 52
    L 92 88
    L 128 88
    L 128 92
    L 92 92
    L 92 128
    L 88 128
    L 88 92
    L 52 92
    L 52 88
    L 88 88
    Z
  " fill="#ffffff" fill-opacity="0.45"/>
</svg>
