<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="34" y1="34" x2="146" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4b6e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="90" y1="90" x2="155" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4b6e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff4b6e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="90" cy="90" r="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="180" height="180" rx="42" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="178" height="178" rx="41" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Radial Core Glow -->
  <circle cx="90" cy="90" r="75" fill="url(#coreGlow)"/>

  <!-- Radar Concentric Rings -->
  <circle cx="90" cy="90" r="68" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.18" stroke-dasharray="4 4"/>
  <circle cx="90" cy="90" r="48" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="90" cy="90" r="28" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Radar Crosshairs -->
  <line x1="90" y1="16" x2="90" y2="164" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.22" stroke-linecap="round"/>
  <line x1="16" y1="90" x2="164" y2="90" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.22" stroke-linecap="round"/>

  <!-- Radar Sweep Arc -->
  <path d="M 90 90 L 150 42 A 68 68 0 0 0 90 22 Z" fill="url(#sweepGrad)"/>

  <!-- Pharma Medical Cross with Radar Intersections -->
  <path d="
    M 75 42
    C 75 37.5, 78.5 34, 83 34
    L 97 34
    C 101.5 34, 105 37.5, 105 42
    L 105 75
    L 138 75
    C 142.5 75, 146 78.5, 146 83
    L 146 97
    C 146 101.5, 142.5 105, 138 105
    L 105 105
    L 105 138
    C 105 142.5, 101.5 146, 97 146
    L 83 146
    C 78.5 146, 75 142.5, 75 138
    L 75 105
    L 42 105
    C 37.5 105, 34 101.5, 34 97
    L 34 83
    C 34 78.5, 37.5 75, 42 75
    L 75 75
    Z
  " fill="url(#crossGrad)" filter="url(#glow)"/>

  <!-- Inner Cross Accent -->
  <path d="
    M 79 48
    L 101 48
    L 101 79
    L 132 79
    L 132 101
    L 101 101
    L 101 132
    L 79 132
    L 79 101
    L 48 101
    L 48 79
    L 79 79
    Z
  " fill="#ffffff" fill-opacity="0.22"/>

  <!-- Active Signal Blip -->
  <circle cx="128" cy="52" r="4.5" fill="#38bdf8"/>
  <circle cx="128" cy="52" r="9" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Central Target Core -->
  <circle cx="90" cy="90" r="5" fill="#ffffff"/>
  <circle cx="90" cy="90" r="9" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.85"/>
</svg>