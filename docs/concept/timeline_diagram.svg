    <text x="260" y="123" text-anchor="middle" fill="#68767E" font-size="9.5">Haemophilia Taxonomy • PostgreSQL 16 Schema • FastAPI Core • Next.js UI Shell</text>
  </g>

  <line x1="260" y1="139" x2="260" y2="154" stroke="#087EA4" stroke-width="2.5" marker-end="url(#blueArrow2)"/>

  <!-- Week 2 -->
  <g filter="url(#cardShadow2)">
    <rect x="20" y="159" width="480" height="74" rx="7" fill="#EEF5F8" stroke="#C8D7DE" stroke-width="1.5"/>
    <rect x="20" y="159" width="480" height="22" rx="7" fill="#143B5D"/>
    <rect x="20" y="171" width="480" height="10" fill="#143B5D"/>
    <text x="32" y="174" fill="#FFFFFF" font-size="10" font-weight="700" letter-spacing="0.3">WEEK 2: INGESTION &amp; AI PIPELINE</text>
